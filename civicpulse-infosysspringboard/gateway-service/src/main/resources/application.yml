server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: citizen-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/citizens/**
        - id: grievance-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/grievances/**
        - id: service-management-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/services/**
        - id: welfare-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/welfare/**
        - id: budget-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/budgets/**
        - id: reporting-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health, info
