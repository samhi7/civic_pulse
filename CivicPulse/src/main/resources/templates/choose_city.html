<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Select City</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS variables -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 0;
        }
        .onboard-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 3rem 2.5rem;
        }
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #e2e8f0;
        }
        .dot.active {
            background-color: var(--primary-color);
            width: 24px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="onboard-card">
        <!-- Progress Steps Tracker -->
        <div class="progress-dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="text-center mb-4">
            <span class="fs-1">🌆</span>
            <h3 class="fw-extrabold text-dark mt-2 mb-1">Choose Your City</h3>
            <p class="text-muted small">Select your municipality region</p>
        </div>

        <form th:action="@{/onboarding/city}" method="POST">
            <div class="mb-4">
                <label class="form-label small fw-bold">Select Active Jurisdiction</label>
                <select name="city" class="form-select form-select-lg fs-6" required>
                    <option value="" disabled selected>Choose a city...</option>
                    <option value="Metro City">Metro City (Active Zone)</option>
                    <option value="River Heights">River Heights (Beta)</option>
                    <option value="Sunset Valley">Sunset Valley (Beta)</option>
                </select>
                <div class="form-text small text-muted mt-2">
                    *Currently, fully active smart routing and field teams are operational in <b>Metro City</b>.
                </div>
            </div>

            <div class="d-flex justify-content-between gap-3 mt-4">
                <a th:href="@{/welcome}" class="btn btn-secondary-custom py-2 px-4 w-50">Back</a>
                <button type="submit" class="btn btn-primary-custom py-2 px-4 w-50">Next Step</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
