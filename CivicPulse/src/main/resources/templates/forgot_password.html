<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Forgot Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS variables -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
        .brand-header {
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="brand-header mb-1">🏛️ CivicPulse</h2>
            <p class="text-muted small">Forgot Password Recovery</p>
        </div>

        <p class="small text-muted mb-4 text-center">
            Enter your registered email address below. We'll send a 6-digit one-time verification passcode (OTP) to reset your password.
        </p>

        <form th:action="@{/forgot-password}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control" id="email" placeholder="citizen@example.com" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-2">Send Verification Code</button>
        </form>

        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary small">← Back to Login</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
