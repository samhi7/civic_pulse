<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - OTP Verification</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS variables -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
        .brand-header {
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }
        .otp-input {
            width: 45px;
            height: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin: 0 4px;
            outline: none;
            transition: all 0.2s ease;
        }
        .otp-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="brand-header mb-1">🏛️ CivicPulse</h2>
            <p class="text-muted small">One-Time Passcode Verification</p>
        </div>

        <p class="small text-muted mb-4 text-center">
            We have sent a verification code to <b th:text="${email}">your email</b>. Please enter the 6-digit code below.
        </p>

        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger py-2 px-3 small border-0 text-danger rounded mb-3" th:text="${error}"></div>

        <form th:action="@{/verify-otp}" method="POST" id="otpForm">
            <input type="hidden" name="email" th:value="${email}">
            <!-- Hidden field to hold final combined OTP -->
            <input type="hidden" name="otp" id="finalOtp">

            <div class="d-flex justify-content-center mb-4">
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-cell otp-input" maxlength="1" pattern="[0-9]" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-2">Verify Code</button>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted mb-0">Didn't receive the code? 
                <a href="#" class="text-decoration-none fw-bold text-primary" onclick="alert('A new OTP has been sent.'); return false;">Resend Code</a>
            </p>
            <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary small d-block mt-3">← Back to Login</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const cells = document.querySelectorAll('.otp-cell');
        
        cells.forEach((cell, idx) => {
            cell.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && idx < cells.length - 1) {
                    cells[idx + 1].focus();
                }
                combineOtp();
            });

            cell.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && cell.value.length === 0 && idx > 0) {
                    cells[idx - 1].focus();
                }
            });
        });

        function combineOtp() {
            let val = "";
            cells.forEach(cell => val += cell.value);
            document.getElementById('finalOtp').value = val;
        }

        document.getElementById('otpForm').addEventListener('submit', () => {
            combineOtp();
        });
    </script>
</body>
</html>
