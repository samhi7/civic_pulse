<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Interactive City Map</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet.js Interactive Mapping CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        #cityMap {
            height: 620px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <span>🏛️ CivicPulse</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/explore}">Explore</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link active" th:href="@{/map}">City Map</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/profile}">Profile</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/faq}">FAQ & Help</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-secondary-custom py-1 px-3" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content py-5">
        <div class="container">
            <!-- Header section -->
            <div class="mb-4">
                <h2 class="fw-bold text-dark mb-1">Interactive City Registry Map</h2>
                <p class="text-muted mb-0">Live spatial mapping of reported issues and verification pins across Metro City.</p>
            </div>

            <!-- Map Container -->
            <div class="card border rounded-4 shadow-sm p-3 bg-white">
                <div id="cityMap"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 CivicPulse. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet.js Mapping Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Map Script -->
    <script th:inline="javascript">
        // Initialize Map centered on Metro City (coordinates seeded in DataInitializer)
        const map = L.map('cityMap').setView([40.7128, -74.0060], 14);

        // Load OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Extract complaints data safely from Thymeleaf model
        /*[+
        const complaintsData = [];
        [# th:each="comp : ${complaints}"]
        if ([[${comp.latitude}]] !== null && [[${comp.longitude}]] !== null) {
            complaintsData.push({
                id: [[${comp.id}]],
                title: [[${comp.title}]],
                category: [[${comp.category}]],
                status: [[${comp.status}]],
                location: [[${comp.location}]],
                lat: [[${comp.latitude}]],
                lng: [[${comp.longitude}]]
            });
        }
        [/]
        +]*/

        // Map Category Emoji Helpers
        const categoryEmojis = {
            "Road Damage": "🛣️",
            "Street Light": "💡",
            "Garbage": "🗑️",
            "Water Leakage": "💧",
            "Drainage": "🪠",
            "Others": "🛠️"
        };

        // Add pins to map
        complaintsData.forEach(comp => {
            const emoji = categoryEmojis[comp.category] || "📍";
            
            // Standard Leaflet Marker
            const marker = L.marker([comp.lat, comp.lng]).addTo(map);
            
            // Rich Marker popup panel content
            const popupContent = `
                <div style="font-family: 'Inter', sans-serif; padding: 4px;">
                    <div style="font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 2px;">
                        ${emoji} ${comp.category.toUpperCase()}
                    </div>
                    <div style="font-weight: 700; color: #0f172a; font-size: 0.9rem; margin-bottom: 4px;">
                        ${comp.title}
                    </div>
                    <div style="font-size: 0.75rem; color: #475569; margin-bottom: 8px;">
                        📍 ${comp.location}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.7rem; font-weight: 700; background-color: #f1f5f9; padding: 2px 6px; border-radius: 4px;">
                            ${comp.status}
                        </span>
                        <a href="/complaints/details/${comp.id}" style="font-size: 0.75rem; font-weight: bold; text-decoration: none; color: #2563eb;">
                            View Workspace →
                        </a>
                    </div>
                </div>
            `;
            
            marker.bindPopup(popupContent);
        });
    </script>
</body>
</html>
