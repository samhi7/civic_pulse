<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Select Locality</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS variables -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 0;
        }
        .onboard-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            padding: 3rem 2.5rem;
        }
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #e2e8f0;
        }
        .dot.active {
            background-color: var(--primary-color);
            width: 24px;
            border-radius: 6px;
        }
        .locality-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .locality-card:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }
        .locality-card.selected {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.03);
        }
    </style>
</head>
<body>

    <div class="onboard-card">
        <!-- Progress Steps Tracker -->
        <div class="progress-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <div class="text-center mb-4">
            <span class="fs-1">🏘️</span>
            <h3 class="fw-extrabold text-dark mt-2 mb-1">Select Your Locality</h3>
            <p class="text-muted small">Choose your primary residential locality zone</p>
        </div>

        <form th:action="@{/onboarding/locality}" method="POST" id="localityForm">
            <input type="hidden" name="locality" id="selectedLocality" required>

            <div class="row g-3">
                <div class="col-6">
                    <div class="locality-card text-center" data-value="Downtown" onclick="selectLocality(this)">
                        <span class="fs-3 d-block">🏢</span>
                        <span class="fw-bold text-dark d-block mt-2">Downtown</span>
                        <span class="text-muted small">Central Business Dist.</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="locality-card text-center" data-value="Green Valley" onclick="selectLocality(this)">
                        <span class="fs-3 d-block">🌳</span>
                        <span class="fw-bold text-dark d-block mt-2">Green Valley</span>
                        <span class="text-muted small">Residential Parks</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="locality-card text-center" data-value="Riverside" onclick="selectLocality(this)">
                        <span class="fs-3 d-block">🌊</span>
                        <span class="fw-bold text-dark d-block mt-2">Riverside</span>
                        <span class="text-muted small">North Riverfront Zone</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="locality-card text-center" data-value="Industrial Area" onclick="selectLocality(this)">
                        <span class="fs-3 d-block">⚙️</span>
                        <span class="fw-bold text-dark d-block mt-2">Industrial Area</span>
                        <span class="text-muted small">Manufacturing sector</span>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between gap-3 mt-4">
                <a th:href="@{/onboarding/city}" class="btn btn-secondary-custom py-2 px-4 w-50">Back</a>
                <button type="submit" class="btn btn-primary-custom py-2 px-4 w-50" id="nextBtn" disabled>Next Step</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectLocality(element) {
            // Remove selection class from all cards
            document.querySelectorAll('.locality-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection class to clicked card
            element.classList.add('selected');
            
            // Set hidden field value
            const val = element.getAttribute('data-value');
            document.getElementById('selectedLocality').value = val;
            
            // Enable Next Button
            document.getElementById('nextBtn').disabled = false;
        }
    </script>
</body>
</html>
