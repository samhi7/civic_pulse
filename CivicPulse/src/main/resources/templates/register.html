<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Citizen Registration</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS variables -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 0;
        }
        .register-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 460px;
            width: 100%;
            padding: 2.5rem;
        }
        .brand-header {
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <h2 class="brand-header mb-1">🏛️ CivicPulse</h2>
            <p class="text-muted small">Create an account to report and track municipal issues</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger py-2 px-3 small border-0 text-danger rounded mb-3" th:text="${error}"></div>

        <form th:action="@{/register}" method="POST" th:object="${user}">
            <div class="mb-3">
                <label for="fullName" class="form-label small fw-bold">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="Jane Doe" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-bold">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="jane@example.com" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label small fw-bold">Password</label>
                <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Min. 6 characters" required>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label small fw-bold">Confirm Password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-2">Create Account</button>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted mb-0">Already have a CivicPulse account? 
                <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary">Login Here</a>
            </p>
            <a th:href="@{/}" class="small text-muted d-block mt-3 text-decoration-none">← Back to Homepage</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
