<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Assign Officer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .navbar-admin {
            background-color: var(--dark-bg) !important;
        }
        .navbar-admin .navbar-brand, 
        .navbar-admin .nav-link {
            color: #cbd5e1 !important;
        }
        .navbar-admin .nav-link:hover {
            color: #ffffff !important;
        }
        .admin-badge {
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (Admin State) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-admin py-3">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">
                <span>🏛️ CivicPulse</span>
                <span class="admin-badge">ADMIN</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/admin/dashboard}">Analytics</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link active" th:href="@{/admin/complaints}">Complaints Registry</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/admin/departments}">Departments</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/admin/users}">Users</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/admin/logs}">Audit Logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light py-1 px-3" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content py-5">
        <div class="container" style="max-width: 680px;">
            <div class="card border rounded-4 shadow-sm p-4 p-md-5 bg-white">
                <h3 class="fw-extrabold text-dark mb-4 text-center">Allocate Field Operations</h3>
                
                <div class="bg-light p-3 rounded border mb-4 small">
                    <div class="row mb-1">
                        <div class="col-4 fw-bold text-muted">Ticket ID:</div>
                        <div class="col-8 text-dark fw-bold" th:text="${complaint.complaintId}">CP-1001</div>
                    </div>
                    <div class="row mb-1">
                        <div class="col-4 fw-bold text-muted">Issue:</div>
                        <div class="col-8 text-dark" th:text="${complaint.title}">Large pothole</div>
                    </div>
                    <div class="row">
                        <div class="col-4 fw-bold text-muted">Address Location:</div>
                        <div class="col-8 text-dark" th:text="${complaint.location}">Baker Street</div>
                    </div>
                </div>

                <form th:action="@{/admin/assign/{id}(id=${complaint.id})}" method="POST">
                    <!-- Select Department -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Target Department</label>
                        <select name="department" class="form-select" required>
                            <option value="Road Maintenance Department" th:selected="${complaint.department == 'Road Maintenance Department'}">Road Maintenance Department</option>
                            <option value="Electricity Board" th:selected="${complaint.department == 'Electricity Board'}">Electricity Board</option>
                            <option value="Waste Management" th:selected="${complaint.department == 'Waste Management'}">Waste Management</option>
                            <option value="Water Supply Department" th:selected="${complaint.department == 'Water Supply Department'}">Water Supply Department</option>
                            <option value="Traffic Control" th:selected="${complaint.department == 'Traffic Control'}">Traffic Control</option>
                            <option value="Others" th:selected="${complaint.department == 'Others'}">Others</option>
                        </select>
                    </div>

                    <!-- Select Officer -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Select Active Field Officer</label>
                        <select name="officerId" class="form-select" required>
                            <option value="" disabled selected>Select an officer...</option>
                            <option th:each="off : ${officers}" th:value="${off.id}" th:text="${off.fullName} + ' (' + ${off.role} + ')'">Frank</option>
                        </select>
                    </div>

                    <!-- Directive Remarks -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Administrative Directives</label>
                        <textarea name="remarks" class="form-control" rows="4" placeholder="Enter instructions for the field worker..." required>Dispatched for immediate repair assessment.</textarea>
                    </div>

                    <div class="d-flex justify-content-between gap-3">
                        <a th:href="@{/admin/complaints}" class="btn btn-secondary-custom w-50 py-2">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom w-50 py-2">Dispatch Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 CivicPulse. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
