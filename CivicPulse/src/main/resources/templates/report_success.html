<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Report Success</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .success-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 3rem 2.5rem;
        }
        .success-icon {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 1.5rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="success-card text-center">
        <span class="success-icon">✅</span>
        <h2 class="fw-extrabold text-dark mb-1">Issue Reported!</h2>
        <p class="text-muted small mb-4">Successfully logged in the municipal database</p>
        
        <div class="bg-light p-4 rounded-4 border text-start mb-4">
            <div class="row mb-2">
                <div class="col-5 text-muted small fw-bold">Complaint ID:</div>
                <div class="col-7 text-dark small fw-extrabold" th:text="${complaint.complaintId}">CP-1001</div>
            </div>
            <div class="row mb-2">
                <div class="col-5 text-muted small fw-bold">Category:</div>
                <div class="col-7 text-dark small fw-bold" th:text="${complaint.category}">Road Damage</div>
            </div>
            <div class="row mb-2">
                <div class="col-5 text-muted small fw-bold">Location:</div>
                <div class="col-7 text-dark small fw-bold" th:text="${complaint.location}">Baker Street</div>
            </div>
            <div class="row">
                <div class="col-5 text-muted small fw-bold">Resolution ETA:</div>
                <div class="col-7 text-success small fw-bold">48 Hours (Standard)</div>
            </div>
        </div>

        <div class="d-flex gap-3">
            <a th:href="@{/dashboard}" class="btn btn-secondary-custom py-2.5 w-50">Dashboard</a>
            <a th:href="@{/complaints/details/{id}(id=${complaint.id})}" class="btn btn-primary-custom py-2.5 w-50">
                Track Issue →
            </a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
